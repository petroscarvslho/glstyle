<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GL Style">
<title>GL Style · Agende seu horário</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1813'/%3E%3Ctext x='32' y='42' font-family='Arial Narrow,Arial' font-weight='700' font-size='28' text-anchor='middle' fill='%23c99a3b'%3EGL%3C/text%3E%3C/svg%3E">
<style>:root{
  --couro:#1d1813; --sup:#2a221b; --sup2:#332a21; --linha:#43372b;
  --latao:#c99a3b; --latao2:#e2b65a; --creme:#f1e7d6; --mudo:#a99a85;
  --ok:#74c27a; --mal:#e06b5b; --aviso:#e0a64b;
  --cond:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --corpo:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--couro);color:var(--creme);font:16px/1.45 var(--corpo)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--latao2);outline-offset:2px}

/* barra do topo com a faixa de barbearia */
.top{position:sticky;top:0;z-index:5;background:var(--couro)}
.poste{height:5px;background:repeating-linear-gradient(-45deg,#b8332a 0 10px,var(--creme) 10px 20px,#2c5aa0 20px 30px,var(--creme) 30px 40px)}
.top-in{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:620px;margin:auto}
.marca{font:700 22px/1 var(--cond);letter-spacing:.02em}
.marca b{color:var(--latao)}
.icone{background:none;border:0;padding:8px;border-radius:10px;color:var(--mudo);font-size:20px;cursor:pointer}
.icone:active{background:var(--sup)}

main{max-width:620px;margin:auto;padding:4px 14px 20px}
h1{font:700 34px/1.05 var(--cond);margin:8px 0 2px}
h2{font:700 21px/1.2 var(--cond);margin:22px 0 8px;color:var(--creme)}
.sub{color:var(--mudo);font-size:14px;margin:0 0 12px}

.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--sup);border-radius:12px;padding:10px 12px}
.kpi span{display:block;color:var(--mudo);font-size:12px}
.kpi strong{font:700 20px/1.2 var(--cond)}
.kpi.dest{background:var(--latao);color:#21180c}.kpi.dest span{color:#3d2c10}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--linha);background:none;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--mudo)}
.chip.on{background:var(--creme);color:var(--couro);border-color:var(--creme)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

.lista{display:flex;flex-direction:column;gap:8px}
.item{background:var(--sup);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:54px 1fr;gap:4px 10px;align-items:start}
.item .hora{font:700 19px/1.1 var(--cond);color:var(--latao2)}
.item .nome{font-weight:600;cursor:pointer}
.item .meta{color:var(--mudo);font-size:13px}
.item .acoes{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.item.feito{opacity:.62}
.linha{background:var(--sup);border-radius:var(--r);padding:12px;display:flex;align-items:center;gap:10px}
.linha .cresce{flex:1;min-width:0}
.linha .cresce .meta{color:var(--mudo);font-size:13px}
.valor{font:700 18px/1 var(--cond);white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--mal)}

.bt{border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;background:var(--sup2);color:var(--creme);min-height:40px}
.bt:active{transform:scale(.97)}
.bt.zap{background:#1f7a46;color:#fff}
.bt.ok{background:var(--ok);color:#10240f}
.bt.ouro{background:var(--latao);color:#21180c}
.bt.mal{background:none;border:1px solid var(--linha);color:var(--mal)}
.bt.leve{background:none;border:1px solid var(--linha);color:var(--mudo)}
.bt.cheio{width:100%;padding:13px;font-size:16px}

.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tag.plano{background:#3b3220;color:var(--latao2)}
.tag.ok{background:#24371f;color:var(--ok)}
.tag.mal{background:#3e2220;color:var(--mal)}
.tag.av{background:#3d3020;color:var(--aviso)}
.tag.mudo{background:var(--sup2);color:var(--mudo)}

.cartao{background:var(--sup);border-radius:var(--r);padding:14px;margin:8px 0}
.cartao.alerta{border:1px solid #6b3a2e}
.vazio{color:var(--mudo);text-align:center;padding:22px 10px;border:1px dashed var(--linha);border-radius:var(--r)}
.mini{font-size:13px;color:var(--mudo)}
.grande{font:700 40px/1 var(--cond)}

/* agenda */
.dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.dia{flex:none;width:52px;border-radius:12px;background:var(--sup);border:0;padding:8px 0;text-align:center;cursor:pointer;color:var(--mudo)}
.dia b{display:block;font:700 20px/1.1 var(--cond);color:var(--creme)}
.dia.on{background:var(--latao);color:#3d2c10}.dia.on b{color:#21180c}
.slot{display:flex;gap:10px;align-items:stretch;min-height:46px}
.slot .h{width:48px;color:var(--mudo);font-size:13px;padding-top:12px;text-align:right}
.slot .c{flex:1;display:flex;gap:6px;flex-direction:column;padding:3px 0;border-top:1px solid var(--linha)}
.livre{background:none;border:1px dashed var(--linha);border-radius:10px;color:var(--mudo);text-align:left;padding:9px 12px;cursor:pointer;font-size:14px}
.ocup{border-radius:10px;padding:8px 12px;background:var(--sup);border-left:4px solid var(--latao);cursor:pointer}

/* formulários */
label.campo{display:block;margin:10px 0}
label.campo span{display:block;color:var(--mudo);font-size:13px;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--couro);border:1px solid var(--linha);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tres{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;align-items:end}
.busca{position:relative}
.sugs{background:var(--sup2);border-radius:10px;margin-top:4px;overflow:hidden}
.sugs button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-bottom:1px solid var(--linha);cursor:pointer}

/* navegação inferior e botão + */
nav.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#16120e;border-top:1px solid var(--linha);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.abas .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:620px;width:100%}
nav.abas button{background:none;border:0;color:var(--mudo);padding:9px 0 10px;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.abas button svg{width:23px;height:23px}
nav.abas button.on{color:var(--latao2)}
nav.abas .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--mal);color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;line-height:16px}
.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:60px;height:60px;border-radius:50%;border:0;background:var(--latao);color:#21180c;font-size:32px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer}

/* folha inferior */
.veu{position:fixed;inset:0;background:rgba(10,8,6,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--sup);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:sobe .22s ease-out}
.folha .pega{width:42px;height:5px;border-radius:3px;background:var(--linha);margin:4px auto 10px}
.folha h2{margin-top:4px}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.folha{animation:none}.bt:active{transform:none}}

.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--creme);color:var(--couro);padding:11px 16px;border-radius:12px;z-index:30;font-weight:600;font-size:14px;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.faixa-demo{background:#3b3220;color:var(--latao2);font-size:13px;padding:8px 12px;border-radius:10px;margin:6px 0}
.barra{height:8px;border-radius:4px;background:var(--sup2);overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--latao)}
.pix{word-break:break-all;font-size:12px;color:var(--mudo);background:var(--couro);border-radius:8px;padding:8px;margin:8px 0}
details summary{cursor:pointer;color:var(--latao2);padding:6px 0}
body.cliente nav.abas,body.cliente .fab,body.cliente #ajustes{display:none!important}
body.cliente{padding-bottom:30px}
.bt[disabled]{cursor:not-allowed}
[hidden]{display:none!important}

/* ===== passada de polimento: organização e separação ===== */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,.marca{text-wrap:balance}
.sub,.mini,.meta,.vazio{text-wrap:pretty}
.valor,.grande,.kpi strong,.hora,.dia b{font-variant-numeric:tabular-nums}
h1{font-size:30px;margin:14px 0 2px}
.data-topo{color:var(--mudo);font-size:14px;margin:14px 0 0}
.data-topo+h1{margin-top:0}
h2{margin:30px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 small{font:500 13px/1 var(--corpo);color:var(--mudo)}
.secao{margin-top:26px}

/* superfícies: borda fina + sombra discreta em vez de blocos chapados */
.item,.cartao,.kpi,.grupo{border:1px solid rgba(255,255,255,.06);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 16px -10px rgba(0,0,0,.6)}
.kpi.dest{border-color:transparent}

/* lista agrupada (uma superfície, linhas separadas por filete) */
.grupo{background:var(--sup);border-radius:16px;overflow:hidden}
.grupo>.linha{background:none;border-radius:0;padding:13px 14px;min-height:56px}
.grupo>.linha+.linha{border-top:1px solid var(--linha)}
.grupo>.linha[data-act]:active{background:var(--sup2)}
.seta{color:var(--linha);font-size:20px;line-height:1}

/* cartões de horário: hierarquia clara e uma ação principal */
.item{grid-template-columns:58px 1fr auto;padding:14px;gap:2px 12px;border-left:3px solid var(--latao)}
.item.feito{border-left-color:var(--linha)}
.item.pedido{border-left-color:var(--aviso)}
.item .nome{font-size:17px}
.item .acoes{grid-column:2/-1;margin-top:10px;gap:8px;align-items:center}
.item .acoes .bt:first-child{flex:1}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--linha);background:none;color:var(--mudo);display:grid;place-items:center;cursor:pointer;transition-property:transform,background-color,color;transition-duration:150ms;transition-timing-function:ease-out}
.ib svg{width:20px;height:20px}
.ib.zap{color:#5fd08f;border-color:#2a5a3e}
.ib.mal{color:var(--mal);border-color:#5a2e28}
.ib:active{transform:scale(.96);background:var(--sup2)}
.desfazer{background:none;border:0;color:var(--mudo);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 4px;min-height:40px}
.bt{transition-property:transform,background-color,opacity;transition-duration:150ms;transition-timing-function:ease-out}
.bt:active{transform:scale(.96)}

/* controle segmentado para sub-seções */
.seg{display:flex;gap:4px;background:var(--sup);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:4px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:none;color:var(--mudo);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px;transition-property:background-color,color;transition-duration:150ms}
.seg button.on{background:var(--creme);color:var(--couro)}

/* cartões de cobrança: valor em destaque e ações numa linha */
.cob{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.cob .acoes{grid-column:1/-1;display:flex;gap:8px;margin-top:12px}
.cob .acoes .bt:first-child{flex:1}

.kpi{padding:12px}
.kpi strong{font-size:21px}
.alerta-cob{display:flex;align-items:center;justify-content:space-between;gap:10px}
.folha{border-top:1px solid rgba(255,255,255,.08)}
.folha h2{margin-top:6px}
.sugs button{min-height:44px}
@media (prefers-reduced-motion:reduce){.bt:active,.ib:active{transform:none}}
.mat{display:grid!important;grid-template-columns:1fr 92px 96px 64px;gap:8px;align-items:center}
.mat input{min-height:40px;padding:8px 10px}
.mat .nome-mat{grid-column:1/-1;background:none;border:0;padding:0;font-weight:600;min-height:28px}
.mat label{display:flex;align-items:center;gap:6px;color:var(--mudo);font-size:13px;grid-column:span 1}
.mat label:first-of-type{grid-column:1/2}
.mat .uso{text-align:right;color:var(--latao2);font-size:14px;grid-column:3/5}
.mat{grid-template-columns:1fr 1fr 90px}
.mat label:first-of-type{grid-column:auto}
.mat .uso{grid-column:auto}

/* ===== tema no estilo da Calculadora ANESTBOX (claro, cartões brancos, grupos coloridos) ===== */
:root{
  --couro:#f3f4f6; --sup:#ffffff; --sup2:#f6f7f9; --linha:#e4e6ea;
  --creme:#17191d; --mudo:#6b7079; --latao:#b8862b; --latao2:#9a6f1f;
  --ok:#1f8a4c; --mal:#c23b3b; --aviso:#b86b10; --warnbg:#fff4e8;
  --cond:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --corpo:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --couro:#121417; --sup:#1b1e23; --sup2:#20242a; --linha:#2b2f36;
  --creme:#eef0f3; --mudo:#9aa0aa; --latao:#d9a64a; --latao2:#e8bd6a;
  --ok:#4cc283; --mal:#ef6b6b; --aviso:#e8a24a; --warnbg:#3a2a1a; color-scheme:dark;
}}
body{font-size:15px}
h1{font-weight:800;letter-spacing:-.02em;font-size:28px}
h2{font-weight:800;letter-spacing:-.01em;font-size:18px}
.marca,.hora,.grande,.valor,.kpi strong,.dia b{font-weight:800;letter-spacing:-.02em}
.top{background:var(--couro)}
.item,.cartao,.kpi,.grupo{border:1px solid var(--linha);box-shadow:none;border-radius:18px}
.kpi.dest{background:var(--creme);color:var(--sup)}.kpi.dest span{color:var(--sup);opacity:.75}
.bt{border-radius:12px}
.bt.leve{background:var(--sup2);border:1px solid var(--linha);color:var(--creme)}
.bt.ok{background:var(--ok);color:#fff}
.bt.ouro{background:var(--creme);color:var(--sup)}
.bt.zap{background:#1f8a4c;color:#fff}
.ib.zap{color:#1f8a4c;border-color:#bfe3cc}
.ib.mal{color:var(--mal);border-color:#efc9c9}
.tag.plano{background:#f6ecd8;color:#8a6116}.tag.ok{background:#e3f4ea;color:#1f8a4c}.tag.mal{background:#fbe5e5;color:#c23b3b}.tag.av{background:var(--warnbg);color:var(--aviso)}.tag.mudo{background:var(--sup2);color:var(--mudo)}
@media (prefers-color-scheme:dark){.tag.plano{background:#3b3220;color:#e8bd6a}.tag.ok{background:#1e3326;color:#4cc283}.tag.mal{background:#3a2020;color:#ef6b6b}.ib.zap{border-color:#2a5a3e;color:#4cc283}.ib.mal{border-color:#5a2e28}}
.chip.on,.seg button.on{background:var(--creme);color:var(--sup);border-color:var(--creme)}
.dia.on{background:var(--creme);color:var(--sup)}.dia.on b{color:var(--sup)}
.fab{background:var(--creme);color:var(--sup);box-shadow:0 6px 20px rgba(0,0,0,.18)}
nav.abas{background:var(--sup);border-top:1px solid var(--linha)}
nav.abas button.on{color:var(--creme);font-weight:700}
.faixa-demo{background:var(--warnbg);color:var(--aviso)}
.aviso{background:var(--creme);color:var(--sup)}
.veu{background:rgba(10,12,15,.45)}
.folha{background:var(--sup)}
input,select,textarea{background:var(--sup2);border-color:var(--linha)}
.item{border-left:3px solid var(--latao)}

/* calculadora de lucro */
.hero{display:grid;gap:14px}
.hero .k{font-size:13px;color:var(--mudo);font-weight:600}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--ok)}
.hero.neg .big{color:var(--mal)}
.hero .s{font-size:12.5px;color:var(--mudo)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--linha);padding-top:14px}
.stats .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.barra2{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--sup2)}
.barra2 span{display:block;height:100%}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mudo)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details.grp{border-radius:18px;padding:4px 14px;margin:10px 0;border:1px solid var(--gbd);background:var(--gbg)}
details.grp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:42px 1fr auto 14px;align-items:center;gap:12px;padding:12px 0;min-height:44px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"›";color:var(--mudo);font-size:18px;transition:transform .15s ease-out}
details.grp[open]>summary::after{transform:rotate(90deg)}
details.grp>summary b{font-size:16px}
details.grp>summary small{display:block;color:var(--mudo);font-size:12.5px;font-weight:500}
details.grp>summary .gt{font-weight:800;font-variant-numeric:tabular-nums}
.gico{width:42px;height:42px;border-radius:12px;background:var(--gic);display:grid;place-items:center;font-size:21px}
.gbody{background:rgba(255,255,255,.72);border-radius:14px;padding:2px 12px;margin:0 0 12px}
@media (prefers-color-scheme:dark){.gbody{background:rgba(0,0,0,.22)}}
.gbody>.gi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--linha);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;cursor:pointer}
.gbody>.gi:first-child{border-top:0}
.gi .n{font-weight:600}.gi small{color:var(--mudo);font-size:12px;display:block}.gi .t{font-weight:700;font-variant-numeric:tabular-nums}
details.grp[data-g=mat]{--gbg:#ebf6f2;--gbd:#cbe7dc;--gic:#d3eee3}
details.grp[data-g=cad]{--gbg:#eef2f7;--gbd:#d6dee9;--gic:#dbe4ef}
details.grp[data-g=taxa]{--gbg:#fbf3e6;--gbd:#efdcbb;--gic:#f5e5c8}
details.grp[data-g=contas]{--gbg:#eef2f7;--gbd:#d6dee9;--gic:#dbe4ef}
details.grp[data-g=impostos]{--gbg:#f2effa;--gbd:#ddd5f1;--gic:#e4ddf6}
details.grp[data-g=voce]{--gbg:#fbf3e6;--gbd:#efdcbb;--gic:#f5e5c8}
details.grp[data-g=equip]{--gbg:#ecf4fb;--gbd:#cfe2f3;--gic:#d6e8f7}
details.grp[data-g=outros]{--gbg:#ebf6f2;--gbd:#cbe7dc;--gic:#d3eee3}

  const total = (fixedCosts || []).reduce((a, c) => a + (Number(c.monthly) || 0), 0);
  const min = (Number(hoursPerMonth) || 0) * 60;
  return min > 0 ? total / min : 0;
}
// custo de material por atendimento: Σ qty × (preço pago ÷ quantos usos rende)
function materialCostOf(service, materials) {

    const m = (materials || []).find(x => x.id === u.id);
    return m && Number(m.yield) > 0 ? t + (Number(u.qty) || 0) * Number(m.price) / Number(m.yield) : t;
  }, 0);
}

  return (Number(service?.durationMin) || 0) * cpm + mat + (Number(price) || 0) * (Number(feePct) || 0) / 100;
}

// Ciclo da assinatura: do último vencimento <= ref até a véspera do próximo.
function cycleRange(dueDay, refDate) {
  const r = startOfDay(refDate);
  let y = r.getFullYear(), m = r.getMonth();
  let start = dayIn(y, m, dueDay);
  if (start > r) { m -= 1; if (m < 0) { m = 11; y -= 1; } start = dayIn(y, m, dueDay); }
  let ny = start.getFullYear(), nm = start.getMonth() + 1;

}

function subscriberStats(client, plan, appts, services, cpm, feePct, refDate, materials) {
  const cyc = cycleRange(client.dueDay || 1, refDate);
  const svc = id => services.find(s => s.id === id);
  const mine = appts.filter(a => a.clientId === client.id && a.status === 'done' && a.covered && inRange(a.start, cyc));
  const cost = mine.reduce((t, a) => t + apptCost(svc(a.serviceId), cpm, 0, 0, materials), 0) + (plan?.price || 0) * (feePct || 0) / 100;
  return { visits: mine.length, cost, profit: (plan?.price || 0) - cost, cycle: cyc };
}
const breakEven = (price, avg) => (avg > 0 ? Math.floor(price / avg) : Infinity);

  return { gross: round2(gross), share };
}

// ---------- Pix BR Code (EMV)
function crc16(str) {
  let crc = 0xffff;
  for (const ch of new TextEncoder().encode(str)) {
    crc ^= ch << 8;
    for (let i = 0; i < 8; i++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + pad2(v.length) + v;
const pixText = (s, max) => stripAccents(s).toUpperCase().replace(/[^A-Z0-9 .\-@]/g, '').trim().slice(0, max);
function pixCode({ key, name, city, amount, txid = '***' }) {
  const mai = tlv('00', 'br.gov.bcb.pix') + tlv('01', String(key).trim());
  let p = tlv('00', '01') + tlv('26', mai) + tlv('52', '0000') + tlv('53', '986');
  if (amount && Number(amount) > 0) p += tlv('54', Number(amount).toFixed(2));
  p += tlv('58', 'BR') + tlv('59', pixText(name, 25) || 'RECEBEDOR') + tlv('60', pixText(city, 15) || 'BRASIL');
  p += tlv('62', tlv('05', String(txid).replace(/[^A-Za-z0-9*]/g, '').slice(0, 25) || '***'));
  p += '6304';
  return p + crc16(p);
}

}

// dinheiro digitado: "12.50", "12,50", "1.234,56", "1,234.56", "1.050", "R$100.00"
function parseMoney(v) {

  if (!/\d/.test(t)) return NaN;
  const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) { const dec = lc > ld ? ',' : '.'; t = t.split(dec === ',' ? '.' : ',').join('').replace(dec, '.'); }

  const n = Number(t);
  return Number.isFinite(n) ? n : NaN;
}

// ---------- caixa avançado
function rhythm(dates) {

  if (ds.length < 2) return null;
  let s = 0; for (let i = 1; i < ds.length; i++) s += daysBetween(ds[i - 1], ds[i]);
  return Math.round(s / (ds.length - 1));
}
function isMissing(dates, today, missingDays) {

  const last = dates.reduce((a, b) => (a > b ? a : b));
  const r = rhythm(dates);
  const limit = Math.max(r ? r * 1.5 : 0, missingDays);
  return daysBetween(last, today) > limit;
}

function billsStatus(state, month, today) {

  return (state.fixedCosts || []).filter(c => c.bill !== false && Number(c.monthly) > 0).map(cost => {
    const due = dayIn(y, m - 1, cost.dueDay || 1);
    const paid = (state.billPayments || []).some(p => p.costId === cost.id && p.month === month);
    return { cost, due, paid, overdue: !paid && startOfDay(today) > due };

}

function forecast30(state, today) {
  const t0 = startOfDay(today), t30 = addDays(t0, 30);
  const items = [];
  const within = d => d >= t0 && d <= t30;
  const nextDue = day => { const c = cycleRange(day, t0); const n = addDays(c.end, 1); return c.start.getTime() === t0.getTime() ? t0 : n; };
  for (const c of state.clients || []) {
    if (!c.planId) continue;
    const plan = (state.plans || []).find(p => p.id === c.planId); if (!plan) continue;
    const d = nextDue(c.dueDay || 1);
    if (within(d)) items.push({ date: d, label: `Mensalidade ${c.name}`, amount: plan.price });
  }
  for (const p of state.pros || []) {
    if (p.owner || p.shareType !== 'fixed') continue;
    const d = nextDue(p.dueDay || 5);
    if (within(d)) items.push({ date: d, label: `Repasse ${p.name || ''}`.trim(), amount: Number(p.shareValue) || 0 });
  }
  // avulsos: média diária dos últimos 30 dias de pagamentos 'single'
  const from = addDays(t0, -30);
  const owners = new Set((state.pros || []).filter(p => p.owner).map(p => p.id));
  const singles = (state.payments || []).filter(p => p.kind === 'single' && (!p.proId || owners.has(p.proId)) && parseLocal(p.date) >= from && parseLocal(p.date) < t0)
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);
  if (singles > 0) items.push({ date: t30, label: 'Avulsos (média 30 dias)', amount: round2(singles) });
  // contas: vencidas não pagas deste mês entram hoje; próximas dentro de 30 dias
  for (const b of billsStatus(state, monthKey(t0), t0)) {
    if (b.paid) continue;
    items.push({ date: b.overdue ? t0 : b.due, label: `${b.cost.name}${b.overdue ? ' (vencida)' : ''}`, amount: -(Number(b.cost.monthly) || 0) });
  }
  const nm = new Date(t0.getFullYear(), t0.getMonth() + 1, 1);
  for (const b of billsStatus(state, monthKey(nm), t0)) {
    if (!b.paid && within(b.due)) items.push({ date: b.due, label: b.cost.name, amount: -(Number(b.cost.monthly) || 0) });
  }
  items.sort((a, b) => a.date - b.date);
  const inflow = round2(items.filter(i => i.amount > 0).reduce((s, i) => s + i.amount, 0));
  const outflow = round2(-items.filter(i => i.amount < 0).reduce((s, i) => s + i.amount, 0));
  return { inflow, outflow, net: round2(inflow - outflow), items };
}

// resumo do mês (fechamento)

  const ownerIds = new Set((state.pros || []).filter(p => p.owner).map(p => p.id));
  const isSalon = p => !p.proId || ownerIds.has(p.proId);
  const own = pays.filter(p => p.kind === 'single' && isSalon(p)).reduce((s, p) => s + p.amount, 0);
  const prodPays = pays.filter(p => p.kind === 'product' && isSalon(p));
  const products = prodPays.reduce((s, p) => s + p.amount, 0), productCost = prodPays.reduce((s, p) => s + (Number(p.cost) || 0), 0);
  const plans = pays.filter(p => p.kind === 'plan').reduce((s, p) => s + p.amount, 0);
  const shares = (state.proPayments || []).filter(p => p.month === month).reduce((s, p) => s + p.amount, 0);
  const fixed = (state.billPayments || []).filter(p => p.month === month).reduce((s, p) => s + p.amount, 0);
  const expenses = (state.expenses || []).filter(e => String(e.date).slice(0, 7) === month).reduce((s, e) => s + e.amount, 0);
  const income = { own: round2(own), plans: round2(plans), shares: round2(shares), products: round2(products) };
  const out = { fixed: round2(fixed), expenses: round2(expenses), productCost: round2(productCost) };
  const tin = own + plans + shares + products, tout = fixed + expenses + productCost;

  document.body.classList.add('cliente');
  const main = document.querySelector('main');
  if (!D) { main.innerHTML = '<h1>Agendamento</h1><p class="sub">Este link está incompleto ou expirou. Peça ao salão o link de agendamento atualizado pelo WhatsApp.</p>'; return; }
  const days = Object.keys(D.d).filter(d => d >= ymd(new Date())).sort();
  const openD = d => !Array.isArray(D.wd) || D.wd.includes(parseLocal(d + 'T12:00').getDay());
  bk.sv = bk.sv || D.sv[0][0]; bk.pr = bk.pr || D.pr[0][0]; bk.day = days.includes(bk.day) ? bk.day : (days.find(openD) || days[0]);
  const svc = D.sv.find(x => x[0] === bk.sv) || D.sv[0];
  const st = { settings: { openHour: D.o, closeHour: D.c, slotMin: D.sl, workDays: D.wd, minAdvanceH: D.ma || 0 }, services: [], appointments: [] };
  const slotsFor = (day, pr) => {
    const busy = (D.d[day] && D.d[day][pr]) || [];
    st.services = busy.map((b, i) => ({ id: 'b' + i, durationMin: b[1] - b[0] }));
    st.appointments = busy.map((b, i) => ({ proId: pr, serviceId: 'b' + i, status: 'scheduled', start: `${day}T${pad2(Math.floor(b[0] / 60))}:${pad2(b[0] % 60)}` }));
    return freeSlots(st, day, pr, svc[3], new Date());
  };
  const slots = bk.day ? slotsFor(bk.day, bk.pr) : [];
  if (!slots.includes(bk.time)) bk.time = null;
  const old = Math.round((Date.now() - (D.g || Date.now())) / 3600000);
  const hojeS = ymd(new Date()), amanhaS = ymd(addDays(new Date(), 1));
  const nomeDia = d => d === hojeS ? 'hoje' : d === amanhaS ? 'amanhã' : parseLocal(d + 'T00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  const turnos = [['Manhã', h => h < '12:00'], ['Tarde', h => h >= '12:00' && h < '18:00'], ['Noite', h => h >= '18:00']].map(([n, f]) => [n, slots.filter(f)]).filter(t => t[1].length);
  const mes = bk.day ? parseLocal(bk.day + 'T00:00').toLocaleDateString('pt-BR', { month: 'long' }) : '';
  const pr = D.pr.find(x => x[0] === bk.pr) || D.pr[0];
  const pronto = bk.time && bk.name.trim().length > 1;
  const resumo = bk.time ? `<b>${esc(svc[1])} · ${brl(svc[2])}</b>${esc(nomeDia(bk.day))}, ${dataBR(parseLocal(bk.day + 'T00:00'))} às ${bk.time}${D.pr.length > 1 ? ' com ' + esc(pr[1]) : ''}` : '<b>Escolha um horário</b>sem cadastro, pelo WhatsApp';
  const enviado = bk.sent ? `<div class="cli-ok"><strong>Pedido enviado ✓</strong><span>Agora é só aguardar a confirmação do ${esc(D.s)} no seu WhatsApp.</span></div>` : '';
  main.innerHTML = `${window.GL_DEMO && code === window.GL_DEMO ? '<div class="faixa-demo" style="margin-top:12px">Demonstração com horários de exemplo. O pedido vai para o WhatsApp do salão.</div>' : ''}
  <div class="cli-grid">
  <div class="cli-a">
    <div class="cli-hero"><div class="mono-g">${esc((D.s || 'GL').split(' ')[0].slice(0, 2).toUpperCase())}</div><h1>${esc(D.s)}</h1><div class="mini" style="align-self:start">Barbearia${D.a ? ' · ' + esc(D.a) : ''}</div>
    <div class="cli-fatos"><span><b>${Array.isArray(D.wd) ? diasTxt(D.wd) : 'Todos os dias'}</b></span><span><b>${pad2(D.o)}h às ${pad2(D.c)}h</b></span><span>sem cadastro</span></div>
    <p>Escolha o serviço e o horário. A confirmação chega no seu WhatsApp.${old >= 24 ? ' Horários de ' + Math.floor(old / 24) + ' dia(s) atrás: podem ter mudado.' : ''}</p>
    <div class="cli-links">${D.a ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(D.a + ' ' + (D.s || ''))}" target="_blank" rel="noopener">Como chegar</a>` : ''}${D.ig ? `<a href="https://instagram.com/${encodeURIComponent(D.ig)}" target="_blank" rel="noopener">@${esc(D.ig)}</a>` : ''}<a href="${waLink(D.w, 'Olá! Tenho uma dúvida.')}" target="_blank" rel="noopener">Falar no WhatsApp</a></div></div>
    ${(D.n || []).map(t => `<div class="aviso-cli">📣 ${esc(t)}</div>`).join('')}
    <h2><span class="passo">1</span>Serviço</h2><div class="svc-lista">${D.sv.map(x => `<button class="svc-row ${bk.sv === x[0] ? 'on' : ''}" data-bk="sv" data-id="${esc(x[0])}"><span class="rd"></span><span><b>${esc(x[1])}</b><small>${x[3]} min</small></span><span class="p num">${brl(x[2])}</span></button>`).join('')}</div>
    ${D.pr.length > 1 ? `<h2>Com quem</h2><div class="chips">${D.pr.map(x => `<button class="chip ${bk.pr === x[0] ? 'on' : ''}" data-bk="pr" data-id="${esc(x[0])}">${esc(x[1])}</button>`).join('')}</div>` : ''}
  </div>
  <div class="cli-b"><div class="cli-caixa">
    <h2><span class="passo">2</span>Dia <small>${esc(mes)}</small></h2><div class="dias">${days.map(d => { const dt = parseLocal(d + 'T00:00'); const n = openD(d) ? slotsFor(d, bk.pr).length : 0; return `<button class="dia ${bk.day === d ? 'on' : ''}" data-bk="day" data-id="${esc(d)}" ${n ? '' : 'style="opacity:.4"'}>${esc(nomeDia(d))}<b>${dt.getDate()}</b></button>`; }).join('')}</div>
    <h2><span class="passo">3</span>Horário <small>${slots.length ? slots.length + ' livres' : ''}</small></h2>${!openD(bk.day) ? '<div class="vazio">Fechado nesse dia. Escolha outro.</div>' : slots.length ? turnos.map(([n, hs]) => `<div class="turno">${n}</div><div class="slots-grade">${hs.map(h => `<button class="chip ${bk.time === h ? 'on' : ''}" data-bk="time" data-id="${h}">${h}</button>`).join('')}</div>`).join('') : '<div class="vazio">Sem horário livre nesse dia. Tente outro dia' + (D.pr.length > 1 ? ' ou outro profissional' : '') + '.</div>'}
    <h2><span class="passo">4</span>Seu nome</h2><input data-bkin="name" value="${esc(bk.name)}" placeholder="Como o ${esc((D.pr[0] && D.pr[0][1]) || 'barbeiro')} te conhece" autocomplete="name" enterkeyhint="send">
    ${enviado}
    <div class="barra-pedido"><div class="in"><div class="res">${resumo}</div><button class="bt" data-bk="send" ${pronto ? '' : 'disabled'}>${bk.sent ? 'Enviar de novo' : 'Pedir horário'}</button></div></div>
    <p class="mini cli-nota">Sem cadastro: o pedido sai do seu WhatsApp. O horário só fica garantido quando o ${esc(D.s)} confirmar.</p>
  </div></div>
  ${D.pol ? `<div class="cartao cli-c"><strong>Regras do salão</strong><p class="mini" style="white-space:pre-line;margin:6px 0 0">${esc(D.pol)}</p></div>` : ''}
  </div>
`;
  main.onclick = e => {
    const el = e.target.closest('[data-bk]'); if (!el || el.disabled) return;
    const k = el.dataset.bk;
    if (k === 'send') {
      try { localStorage.setItem('gl.nome', bk.name.trim()); } catch (e) {}
      const pr = D.pr.find(x => x[0] === bk.pr), dt = parseLocal(`${bk.day}T${bk.time}`);
      const msg = `Olá! Quero marcar ${svc[1]}${D.pr.length > 1 ? ` com ${pr[1]}` : ''} ${dataBR(dt)} às ${bk.time}.\nNome: ${bk.name.trim()}\n#GL[${bk.day}T${bk.time}|${svc[0]}|${pr[0]}|${bk.name.trim()}]`;
      const lk = document.createElement('a'); lk.href = waLink(D.w, msg); lk.target = '_blank'; lk.rel = 'noopener'; document.body.appendChild(lk); lk.click(); lk.remove(); bk.sent = true; bookingPage(code); return;
    }
    bk[k] = el.dataset.id; bk.sent = false; bookingPage(code);
    if (k === 'time' && innerWidth < 760) { const n = main.querySelector('[data-bkin="name"]'); if (n && !bk.name.trim()) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  };
  main.oninput = e => { const k = e.target.dataset.bkin; if (k) { bk[k] = e.target.value; const b = main.querySelector('[data-bk="send"]'); b.disabled = !(bk.time && bk.name.trim().length > 1); } };
}

function bootBooking() { const h = location.hash.replace(/^#(agendar=)?/, ''); bookingPage(h || window.GL_DEMO || ''); }
if (document.body.classList.contains('cliente')) window.addEventListener('hashchange', bootBooking);
if (document.body.classList.contains('cliente')) bootBooking();

</script>
</body>
</html>
